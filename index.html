
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Mini Clock & Photo Frame</title>

<style>
* { box-sizing:border-box; }

html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#101923;
  color:#fff;
  font-family:Arial,sans-serif;
}

#photo {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background-position:center;
  background-repeat:no-repeat;
  background-size:contain;
  background-color:#101923;
}

#clockbar {
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  height:76px;
  background:rgba(5,12,20,.84);
  display:table;
  z-index:2;
}

.clockcell {
  display:table-cell;
  width:50%;
  text-align:center;
  vertical-align:middle;
  padding:5px 3px;
}

.clockcell:first-child {
  border-right:1px solid rgba(255,255,255,.2);
}

.city {
  color:#b8cddd;
  font-size:11px;
  letter-spacing:1px;
}

.time {
  font-size:30px;
  font-weight:bold;
  line-height:1.25;
}

.kr { color:#9fe0ff; }

.date {
  color:#c6d4df;
  font-size:11px;
}

#controls {
  position:absolute;
  top:5px;
  left:5px;
  right:5px;
  z-index:5;
  text-align:center;
  background:rgba(0,0,0,.65);
  border-radius:6px;
  padding:5px;
}

button,.pick {
  display:inline-block;
  border:1px solid #8293a1;
  border-radius:5px;
  background:#27394a;
  color:white;
  padding:8px;
  font-size:12px;
  margin:2px;
}

#picker {
  position:absolute;
  left:-9999px;
}

#status {
  color:#dce5ec;
  font-size:11px;
  margin:3px;
}

#showui {
  position:absolute;
  top:5px;
  right:5px;
  z-index:6;
  display:none;
}

body.hideui #controls { display:none; }
body.hideui #showui { display:block; }

body.clockonly #photo {
  display:none;
}

@media(max-width:480px) {
  .time { font-size:22px; }
  .city,.date { font-size:10px; }
  #clockbar { height:70px; }
}
</style>
</head>

<body>

<div id="photo"></div>

<div id="clockbar">
  <div class="clockcell">
    <div class="city">MICHIGAN · USA</div>
    <div id="usTime" class="time">--:--:--</div>
    <div id="usDate" class="date"></div>
  </div>

  <div class="clockcell">
    <div class="city">SEOUL · KOREA</div>
    <div id="krTime" class="time kr">--:--:--</div>
    <div id="krDate" class="date"></div>
  </div>
</div>

<button id="showui" type="button">설정</button>

<div id="controls">
  <label class="pick" for="picker">사진 선택</label>
  <input type="file" id="picker" accept="image/*" multiple>

  <button id="toggle" type="button">시계만 보기</button>
  <button id="fit" type="button">사진 채우기</button>
  <button id="hide" type="button">버튼 숨기기</button>
  <button id="fullscreen" type="button">전체화면 안내</button>

  <div id="status">
    사진은 iPad에서만 처리돼.
  </div>
</div>

<script type="text/javascript">
(function () {

  var days = ["일","월","화","수","목","금","토"];

  function two(n) {
    return n < 10 ? "0"+n : ""+n;
  }

  function nthSunday(y,m,n) {
    var d = new Date(Date.UTC(y,m,1));
    return (7-d.getUTCDay())%7+1+(n-1)*7;
  }

  function michiganOffset(now) {
    var y = now.getUTCFullYear();
    var start = Date.UTC(y,2,nthSunday(y,2,2),7);
    var end = Date.UTC(y,10,nthSunday(y,10,1),6);

    return now.getTime() >= start &&
      now.getTime() < end ? -4 : -5;
  }

  function update(prefix,offset,now) {
    var d = new Date(now.getTime()+offset*3600000);

    document.getElementById(prefix+"Time").innerHTML =
      two(d.getUTCHours())+":"+
      two(d.getUTCMinutes())+":"+
      two(d.getUTCSeconds());

    document.getElementById(prefix+"Date").innerHTML =
      d.getUTCFullYear()+"."+
      two(d.getUTCMonth()+1)+"."+
      two(d.getUTCDate())+" ("+
      days[d.getUTCDay()]+")";
  }

  function tick() {
    var now = new Date();
    update("us",michiganOffset(now),now);
    update("kr",9,now);
  }

  tick();
  setInterval(tick,1000);

  var urls = [];
  var index = 0;
  var photo = document.getElementById("photo");
  var status = document.getElementById("status");
  var clockOnly = false;
  var cover = false;

  function showPhoto() {
    if (!urls.length) return;

    photo.style.backgroundImage =
      'url("' + urls[index] + '")';
  }

  function nextPhoto() {
    if (urls.length > 1) {
      index = (index+1)%urls.length;
      showPhoto();
    }
  }

  setInterval(nextPhoto,15000);

  document.getElementById("picker").onchange =
    function() {
      var files = this.files;
      if (!files || !files.length) return;

      urls = [];
      index = 0;

      var limit = Math.min(files.length,20);

      for (var i=0;i<limit;i++) {
        (function(file) {
          if (file.type.indexOf("image/") !== 0) return;

          var reader = new FileReader();

          reader.onload = function(e) {
            urls.push(e.target.result);
            showPhoto();
            status.innerHTML =
              urls.length+"장 불러옴";
          };

          reader.onerror = function() {
            status.innerHTML =
              "사진 읽기 실패";
          };

          reader.readAsDataURL(file);
        })(files[i]);
      }
    };

  document.getElementById("toggle").onclick =
    function() {
      clockOnly = !clockOnly;

      document.body.className =
        clockOnly ? "clockonly" : "";

      this.innerHTML =
        clockOnly ? "사진 함께 보기" : "시계만 보기";
    };

  document.getElementById("fit").onclick =
    function() {
      cover = !cover;

      photo.style.backgroundSize =
        cover ? "cover" : "contain";

      this.innerHTML =
        cover ? "사진 전체 보기" : "사진 채우기";
    };

  document.getElementById("hide").onclick =
    function() {
      document.body.className += " hideui";
    };

  document.getElementById("showui").onclick =
    function() {
      document.body.className =
        clockOnly ? "clockonly" : "";
    };

  document.getElementById("fullscreen").onclick =
    function() {
      alert(
        "Safari 공유 버튼에서 홈 화면에 추가를 선택하고, " +
        "홈 화면 아이콘으로 실행하면 주소창 없이 사용할 수 있어."
      );
    };

})();
</script>

</body>
</html>
