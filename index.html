<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Michigan & Korea Clock</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #101820;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
}

.clock-section {
  position: absolute;
  left: 0;
  width: 100%;
  height: 50%;
  display: table;
  text-align: center;
}

#us {
  top: 0;
  background: #142438;
}

#kr {
  top: 50%;
  background: #10313b;
  border-top: 2px solid #45606c;
}

.clock-content {
  display: table-cell;
  vertical-align: middle;
  padding: 10px;
}

.city {
  font-size: 24px;
  font-weight: bold;
  letter-spacing: 3px;
  color: #b7cbdc;
  margin-bottom: 12px;
}

.time {
  font-size: 100px;
  font-weight: bold;
  line-height: 1.1;
  letter-spacing: 2px;
  white-space: nowrap;
}

#krTime {
  color: #9fe5ff;
}

.date {
  margin-top: 15px;
  font-size: 25px;
  color: #d5e0e9;
}

/* iPad mini 1 landscape */
@media (max-width: 1100px) {
  .time {
    font-size: 12vw;
  }

  .city {
    font-size: 3vw;
  }

  .date {
    font-size: 3vw;
  }
}

/* Portrait */
@media (max-width: 600px) {
  .time {
    font-size: 13vw;
  }

  .city {
    font-size: 4vw;
  }

  .date {
    font-size: 3.5vw;
  }
}
</style>
</head>

<body>

<div id="us" class="clock-section">
  <div class="clock-content">
    <div class="city">MICHIGAN · USA</div>
    <div id="usTime" class="time">--:--:--</div>
    <div id="usDate" class="date"></div>
  </div>
</div>

<div id="kr" class="clock-section">
  <div class="clock-content">
    <div class="city">SEOUL · KOREA</div>
    <div id="krTime" class="time">--:--:--</div>
    <div id="krDate" class="date"></div>
  </div>
</div>

<script type="text/javascript">
(function () {

  var days = [
    "일요일", "월요일", "화요일",
    "수요일", "목요일", "금요일", "토요일"
  ];

  function two(n) {
    return n < 10 ? "0" + n : "" + n;
  }

  function nthSunday(year, month, nth) {
    var first = new Date(Date.UTC(year, month, 1));
    var firstSunday =
      (7 - first.getUTCDay()) % 7 + 1;

    return firstSunday + (nth - 1) * 7;
  }

  function michiganOffset(now) {
    var year = now.getUTCFullYear();

    var marchSunday =
      nthSunday(year, 2, 2);

    var novemberSunday =
      nthSunday(year, 10, 1);

    var dstStart = Date.UTC(
      year, 2, marchSunday, 7, 0, 0
    );

    var dstEnd = Date.UTC(
      year, 10, novemberSunday, 6, 0, 0
    );

    if (
      now.getTime() >= dstStart &&
      now.getTime() < dstEnd
    ) {
      return -4;
    }

    return -5;
  }

  function updateClock(prefix, offset, now) {
    var local = new Date(
      now.getTime() + offset * 3600000
    );

    var hours = two(local.getUTCHours());
    var minutes = two(local.getUTCMinutes());
    var seconds = two(local.getUTCSeconds());

    document.getElementById(
      prefix + "Time"
    ).innerHTML =
      hours + ":" + minutes + ":" + seconds;

    var year = local.getUTCFullYear();
    var month = local.getUTCMonth() + 1;
    var day = local.getUTCDate();
    var weekday = days[local.getUTCDay()];

    document.getElementById(
      prefix + "Date"
    ).innerHTML =
      year + "년 " +
      month + "월 " +
      day + "일 " +
      weekday;
  }

  function tick() {
    var now = new Date();

    updateClock(
      "us",
      michiganOffset(now),
      now
    );

    updateClock(
      "kr",
      9,
      now
    );
  }

  tick();
  setInterval(tick, 1000);

})();
</script>

</body>
</html>
